[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "sqlalchemy>=2.0.0,<3.0",
    "uvicorn==0.48.0",
    "alembic>=1.11,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "supabase==2.0.0",
    "psycopg2-binary>=2.9,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ipykernel==7.2.0",
    "pytest==9.0.3",
    "ruff==0.15.15",
]
